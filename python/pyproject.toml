[build-system]
requires = ["setuptools>=78.1.1", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "bml"
version = "0.1.0"
description = "Brain Modulation Lab toolbox - Python translation of MATLAB BML toolbox"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scipy>=1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
